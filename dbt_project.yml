name: jaffle_shop

profile: jaffle_shop

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  jaffle_shop:
    +schema: raw
    statuts_commande:
       +column_types:
        statut: varchar
        libelle: varchar
        est_paye: boolean
models:
  jaffle_shop:
    #+static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized : view
    marts:
      +materialized: table